[build-system]
requires = ["setuptools", "setuptools-rust"]
# Set up a custom backend whose only function is to hack ext-modules
# below to install rustfst-ffi.so instead of rustfst_python.so
backend-path = ["_backend"]
build-backend = "rustfst_backend.build_meta"

[project]
name = "rustfst"
version = "0.1"
description = "Standalone Python bindings for RustFST"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}
authors = [
    {name = "Alexandre Caulier", email = "alexandre.caulier.a@gmail.com"},
    {name = "David Huggins-Daines", email = "dhd@ecolingui.ca"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
dependencies = [
    "patchelf>=0.17; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19.1",
    "pytest>=7.0.0",
    "ruff>=0.7.0"
]
docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=8.0.0",
    "mkdocs-macros-plugin>=1.3.7",
    "mike>=1.1.0",
    "mkdocs-autorefs>=0.4.0",
    "mkdocstrings[python]>=0.19.0",
    "mkdocs-section-index>=0.3.5"
]

[tool.setuptools]
packages = ["rustfst"]

[tool.setuptools.package-data]
rustfst = ["py.typed"]

[[tool.setuptools-rust.ext-modules]]
target = "rustfst._rustfst_python"
path = "Cargo.toml"
binding = "NoBinding"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
